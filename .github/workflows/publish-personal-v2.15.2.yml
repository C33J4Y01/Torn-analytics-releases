name: Publish personal Torn Analytics v2.15.2

on:
  push:
    branches:
      - main
    paths:
      - personal-v2.15.2.trigger

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out personal live channel
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main

      - name: Reproduce exact validated v2.15.2 userscript
        run: |
          python3 <<'PY'
          from pathlib import Path
          import hashlib

          path = Path('torn-analytics.user.js')
          source = path.read_text(encoding='utf-8')
          base_blob = '1a1dfc4f64a9d1c3db397e2d6c88b2b4ad7aafef'
          target_blob = 'b14a200b34cc8055c7276b5229c582504f97f4d9'

          def git_blob_sha(text):
              data = text.encode('utf-8')
              header = f'blob {len(data)}\0'.encode('ascii')
              return hashlib.sha1(header + data).hexdigest()

          current = git_blob_sha(source)
          if current == target_blob:
              print('Personal live channel already matches validated v2.15.2.')
              raise SystemExit(0)
          if current != base_blob:
              raise SystemExit(f'Unexpected release baseline: {current}')

          replacements = [
              ('// @version      2.15.1', '// @version      2.15.2'),
              ("  const VERSION = '2.15.1';", "  const VERSION = '2.15.2';"),
              ("    '_###PDA-APIKEY###_';", "    '###PDA-APIKEY###';"),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence of {old!r}, found {count}')
              source = source.replace(old, new, 1)

          actual = git_blob_sha(source)
          if actual != target_blob:
              raise SystemExit(f'Exact blob verification failed: {actual} != {target_blob}')

          path.write_text(source, encoding='utf-8')
          print('Exact validated v2.15.2 blob reproduced:', actual)
          PY

      - name: Commit personal v2.15.2 live update
        run: |
          if git diff --quiet -- torn-analytics.user.js; then
            echo "Personal live channel already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- torn-analytics.user.js
          git commit -m "Publish personal Torn Analytics v2.15.2"
          git push origin main
