name: Trigger v2.15.0 publisher

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/trigger-v2.15.0.yml

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-v2.15.0.yml --repo C33J4Y01/Torn-analytics-releases --ref main
