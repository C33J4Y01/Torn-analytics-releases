name: Validate stable userscript

on:
  pull_request:
    paths:
      - torn-analytics.user.js
      - .github/workflows/validate-release.yml
  push:
    branches:
      - main
    paths:
      - torn-analytics.user.js
      - .github/workflows/validate-release.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check torn-analytics.user.js
      - name: Check stable release metadata
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const source = fs.readFileSync('torn-analytics.user.js', 'utf8');
          const stable = 'https://raw.githubusercontent.com/C33J4Y01/Torn-analytics-releases/main/torn-analytics.user.js';
          assert.match(source, /^\/\/ @version\s+\d+\.\d+\.\d+$/m);
          assert.ok(source.includes('// @updateURL    ' + stable));
          assert.ok(source.includes('// @downloadURL  ' + stable));
          assert.ok(source.includes("'###PDA-APIKEY###'"));
          assert.ok(!source.includes('-----BEGIN PRIVATE KEY-----'));
          assert.ok(!/gh[pousr]_[A-Za-z0-9_]{20,}/.test(source));
          console.log('Stable metadata and basic secret checks passed.');
          NODE
      - name: Record release checksum
        run: sha256sum torn-analytics.user.js
