name: Publish Torn Analytics v2.15.3 exact

on:
  push:
    branches:
      - main
    paths:
      - .release/v2.15.3.trigger
  pull_request:
    branches:
      - main
    paths:
      - .release/v2.15.3.trigger

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out publication target
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}

      - name: Apply exact validated userscript patch
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="b14a200b34cc8055c7276b5229c582504f97f4d9"
          TARGET_SHA="ad4f5b7ff34d46686e41150cd36e36b15109c162"
          CURRENT_SHA="$(git hash-object torn-analytics.user.js)"

          if [ "$CURRENT_SHA" = "$TARGET_SHA" ]; then
            echo "Live userscript already matches validated v2.15.3."
            exit 0
          fi

          if [ "$CURRENT_SHA" != "$BASE_SHA" ]; then
            echo "Unexpected live baseline: $CURRENT_SHA"
            exit 1
          fi

          git apply --check .release/v2.15.3-userscript.patch
          git apply .release/v2.15.3-userscript.patch

          ACTUAL_SHA="$(git hash-object torn-analytics.user.js)"
          if [ "$ACTUAL_SHA" != "$TARGET_SHA" ]; then
            echo "Exact artifact verification failed: $ACTUAL_SHA != $TARGET_SHA"
            exit 1
          fi

          grep -q '^// @version      2.15.3$' torn-analytics.user.js
          grep -q "const VERSION = '2.15.3';" torn-analytics.user.js
          grep -q "'###PDA-APIKEY###';" torn-analytics.user.js
          if grep -q "'_###PDA-APIKEY###_';" torn-analytics.user.js; then
            echo "Wrapped TornPDA API-key token is still present."
            exit 1
          fi

      - name: Commit exact personal live artifact
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- torn-analytics.user.js; then
            echo "No userscript change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- torn-analytics.user.js
          git commit -m "Publish Torn Analytics v2.15.3 personal live test"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git push origin HEAD:"${{ github.head_ref }}"
          else
            git push origin main
          fi
