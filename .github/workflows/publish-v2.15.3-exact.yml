name: Publish Torn Analytics v2.15.3 exact

on:
  pull_request:
    branches:
      - main
    paths:
      - .release/v2.15.3.trigger

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out publication target
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.head_ref }}

      - name: Reproduce exact validated v2.15.3 artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import hashlib

          path = Path('torn-analytics.user.js')
          source = path.read_text(encoding='utf-8')
          base_sha = 'b14a200b34cc8055c7276b5229c582504f97f4d9'
          target_sha = 'ad4f5b7ff34d46686e41150cd36e36b15109c162'

          def blob_sha(text):
              data = text.encode('utf-8')
              return hashlib.sha1(f'blob {len(data)}\0'.encode('ascii') + data).hexdigest()

          current = blob_sha(source)
          if current == target_sha:
              print('Candidate already matches exact validated v2.15.3 artifact.')
              raise SystemExit(0)
          if current != base_sha:
              raise SystemExit(f'Unexpected live baseline: {current}')

          replacements = [
              ('// @version      2.15.2', '// @version      2.15.3'),
              ("  const VERSION = '2.15.2';", "  const VERSION = '2.15.3';"),
              ('  // TornPDA replaces this documented marker at injection time with',
               '  // TornPDA replaces this exact documented marker at injection time with'),
              ("    // TornPDA's GM_* value compatibility layer is backed by the page's\n"
               "    // localStorage. Never read API-key material through it. TornPDA should\n"
               "    // use its injected API key; any manually entered override is session-only.",
               "    // TornPDA supplies its configured API key through runtime injection.\n"
               "    // Do not persist a manual fallback through TornPDA's page-local GM layer."),
              ('    // Never route TornPDA secrets through GM_setValue because TornPDA maps\n'
               '    // that compatibility API to page localStorage. A manual override remains\n'
               '    // only in this userscript execution; normal TornPDA use relies on injection.',
               '    // A manual TornPDA override is a session-only fallback. Normal TornPDA\n'
               '    // use relies on the app replacing the documented injection token.'),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence of replacement source; found {count}: {old!r}')
              source = source.replace(old, new, 1)

          actual = blob_sha(source)
          if actual != target_sha:
              raise SystemExit(f'Exact artifact verification failed: {actual} != {target_sha}')

          if "'_###PDA-APIKEY###_';" in source:
              raise SystemExit('Wrapped TornPDA API-key token remains present.')
          if source.count("'###PDA-APIKEY###';") != 1:
              raise SystemExit('Exact bare TornPDA API-key token is not present exactly once.')

          path.write_text(source, encoding='utf-8')
          print('Exact validated v2.15.3 artifact reproduced:', actual)
          PY

      - name: Commit exact personal live artifact to candidate branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- torn-analytics.user.js; then
            echo "No userscript change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- torn-analytics.user.js
          git commit -m "Publish Torn Analytics v2.15.3 personal live test"
          git push origin HEAD:"${{ github.head_ref }}"
